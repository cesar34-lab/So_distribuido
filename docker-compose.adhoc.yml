# docker-compose.adhoc.yml
# Este archivo se usa para desplegar un NODO ÚNICO en una máquina física
# que forma parte de la red Ad hoc.

version: '3.8'

services:
  nodo-so:
    build:
      context: .
      dockerfile: Dockerfile.nodo
    container_name: so_nodo
    network_mode: "host" # <-- CLAVE: Usar la red del host para la red Ad hoc
    environment:
      - NODE_ID=${NODE_ID:-nodo_adhoc_default}
      - NODE_PORT=${NODE_PORT:-10000}
      # Lista de peers en la red Ad hoc, separados por comas (ej: "192.168.1.10:10000,192.168.1.11:10000")
      - NODE_PEERS=${NODE_PEERS:-}
    volumes:
      # El store necesita persistencia en el host
      - ./store_local:/app/store_local
    restart: unless-stopped